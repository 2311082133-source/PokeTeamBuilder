<!DOCTYPE html>
<html lang="es">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Crear cuenta | PokéTeam Builder</title>

        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/auth.css">

    </head>

    <body>

        <div class="auth-container">

            <div class="auth-card">

                <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/master-ball.png"
                class="logo">

                <h1>Crear cuenta</h1>

                <form id="registerForm">

                    <input
                    id="name"
                    type="text"
                    placeholder="Nombre completo"
                    required>

                    <input
                    id="email"
                    type="email"
                    placeholder="Correo electrónico"
                    required>

                    <input
                    id="password"
                    type="password"
                    placeholder="Contraseña"
                    required>

                    <button>

                        Registrarme

                    </button>

                </form>

                <p class="bottom-text">

                    ¿Ya tienes cuenta?

                    <a href="login.html">

                        Iniciar sesión

                    </a>

                </p>

                <div id="message"></div>

            </div>

    </div>

        <script
            type="module"
            src="js/registro.js">
        </script>
        <script type="module" src="js/navbar-auth.js"></script>

    </body>

</html>
